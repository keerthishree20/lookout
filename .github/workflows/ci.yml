name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lookout
          POSTGRES_PASSWORD: lookout
          POSTGRES_DB: lookout_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lookout -d lookout_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q
        env:
          GEMINI_API_KEY: ""
          LOOKOUT_LIVE_TRAFFIC: "0"
          LOOKOUT_TEST_DATABASE_URL: postgresql://lookout:lookout@localhost:5432/lookout_test
      - name: Evaluation report
        run: python -m lookout.evaluate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
        env:
          JWT_SECRET: ci-only-secret-not-used-anywhere-else-000000
